[project]
name = "mypackage"
version = "0.1.0"
description = "Template Python project with guardrails for auditing AI-generated code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32",
]

[project.scripts]
mypackage = "mypackage.cli:main"

[dependency-groups]
dev = [
    # --- tests -----------------------------------------------------------
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",        # property-based testing
    "pytest-randomly>=3.15",    # order-dependence detector
    "pytest-timeout>=2.3",      # hangs fail instead of wedging CI
    "time-machine>=2.15",       # deterministic clock, incl. tz
    # --- lint & architecture --------------------------------------------
    "ruff>=0.15",
    "import-linter>=2.0",
    # --- types ------------------------------------------------------------
    "ty>=0.0.1a1",              # Astral type checker (pre-1.0; the lockfile pins it exactly)
    "mypy>=1.11",               # cross-check while ty matures
    "types-requests>=2.32",
    # --- hooks ------------------------------------------------------------
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mypackage"]          # py.typed lives inside the package, so it ships in the wheel

[tool.hatch.build.targets.sdist]
exclude = [".idea", ".venv", ".hypothesis"]

# --------------------------------------------------------------------------
# Exercise 1: functional verification
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
timeout = 60
markers = [
    "adversarial: hostile-upstream / pathological-input tests (run on their own in CI)",
]

[tool.coverage.run]
source = ["mypackage"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",              # Protocol method bodies
]

# --------------------------------------------------------------------------
# Exercise 2: static analysis   /   Exercise 4: architecture guard
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "W",    # baseline
    "DTZ",                                  # flake8-datetimez
    "RET",                                  # flake8-return
    "S",                                    # flake8-bandit: security lint, so no separate bandit run
    "ASYNC", "LOG", "G",                    # logging/async footguns
    "PT",                                   # flake8-pytest-style
    "SIM", "RUF", "PERF", "C90",            # simplification, perf, complexity
    "TRY", "EM",                            # exception hygiene
    "PTH", "TID", "ARG", "N", "A",
    "PL",                                   # pylint subset (PLR0913, PLR2004, ...)
    "D",                                    # pydocstyle: enforce accurate docstrings
]
ignore = [
    "B008",                 # function call in default argument
    "TRY003",               # long messages outside exception class
    "D203", "D213",         # conflicting pydocstyle pairs
    "COM812",               # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101", "PLR2004", "D", "ARG", "EM"]  # asserts, magic numbers, fakes

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Deprecated and naive. Use datetime.now(timezone.utc)."
"datetime.datetime.utcfromtimestamp".msg = "Naive. Use fromtimestamp(..., tz=timezone.utc)."
"requests.get".msg = "Use the module-level Session so timeouts/retries/auth apply uniformly."
"requests.post".msg = "Use the module-level Session."
"requests.request".msg = "Use the module-level Session."
"pickle".msg = "Never unpickle untrusted data; use json."
"yaml.load".msg = "Use yaml.safe_load."

# --------------------------------------------------------------------------
# Exercise 4: architectural alignment (types)
# --------------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"
invalid-return-type = "error"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["mypackage"]

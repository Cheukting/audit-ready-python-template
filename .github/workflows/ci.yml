name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs opt in to anything more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"
  HYPOTHESIS_PROFILE: ci

# Third-party actions are pinned to a commit SHA, with the tag as a comment.
# zizmor checks this, and Dependabot keeps the pins up to date.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # dev (the default group) for ruff, plus the locked semgrep group.
      - run: uv sync --group semgrep

      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: Custom static analysis rules
        run: uv run semgrep --config .semgrep.yml --error --disable-version-check mypackage/ tests/

  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }} / ${{ matrix.tz || 'default tz' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        tz: ["UTC"]
        include:
          # The runner defaults to UTC, which hides timezone bugs. These offsets are
          # chosen to expose them: +09:00, a US zone with DST, and a :45 offset.
          - {os: ubuntu-latest, python-version: "3.13", tz: "Asia/Tokyo"}
          - {os: ubuntu-latest, python-version: "3.13", tz: "America/Los_Angeles"}
          - {os: ubuntu-latest, python-version: "3.13", tz: "Asia/Kathmandu"}
          # TZ does not work on Windows, so that job keeps the default.
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.13"}
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync    # dev only: the tools/semgrep groups are not needed to test

      - name: Run tests (random order, coverage gate)
        run: uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      # Artifact names cannot contain "/", and IANA zone names do (America/Los_Angeles).
      - name: Artifact name
        if: always()
        id: artifact
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: echo "name=junit-${RUNNER_OS}-py${PYTHON_VERSION}-${TZ:-default}" | tr / - >> "$GITHUB_OUTPUT"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: junit.xml
          if-no-files-found: ignore

  adversarial:
    name: Adversarial (fuzz + fault injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Hostile upstream, parser fuzzing, fault injection
        run: uv run pytest -m adversarial --hypothesis-show-statistics

  types:
    name: Types & architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ty check                    # package and tests
      - run: uv run mypy --strict mypackage/      # until ty is 1.0
      - run: uv run lint-imports

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Unset the workflow-wide UV_FROZEN for this one step: with it, `uv lock --check`
      # only checks that uv.lock is valid, not that it matches pyproject.toml, so a
      # stale lockfile passed. (`--locked` can't be combined with UV_FROZEN.)
      - name: Lockfile is in sync with pyproject.toml
        run: env -u UV_FROZEN uv lock --check

      # dev (ruff) plus the locked tools group (pip-audit, zizmor, cyclonedx-bom).
      - run: uv sync --group tools

      # Two pip-audit runs, because each run queries one database:
      #  - runtime deps against PyPI's data;
      #  - every group (dev and the CI tools included) against OSV, which aggregates
      #    more advisory sources.
      # --disable-pip audits the pinned versions without installing them (pip-audit -r
      # is otherwise "functionally equivalent to pip install -r"). In that mode
      # --require-hashes only checks hashes are PRESENT, for either service, despite
      # pip-audit's warning suggesting -s pypi validates them. Hash validity comes
      # from uv, which checks every download against uv.lock.
      # osv-scanner would also read uv.lock, but it is a Go binary (not on PyPI)
      # and its action loads a Docker image by mutable tag.
      - name: Known vulnerabilities (runtime deps, PyPI DB)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uv run pip-audit --strict --disable-pip --require-hashes --requirement requirements.txt

      - name: Known vulnerabilities (all groups incl. dev and tools, OSV DB)
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt > requirements.txt
          uv run pip-audit --strict --disable-pip --require-hashes --vulnerability-service osv --requirement requirements.txt

      - name: Static security lint
        run: uv run ruff check --select S mypackage/

      - name: Workflow static analysis
        run: uv run zizmor --min-severity medium .github/workflows/

      # Point cyclonedx-py at a runtime-only environment. With no path it describes the
      # Python running it (here, the .venv holding dev and the tools). The runtime env is
      # built in a separate directory, so .venv keeps the tools and the SBOM excludes them.
      # --pyproject records mypackage as the SBOM's subject, not as one of its components.
      # --output-reproducible with SOURCE_DATE_EPOCH (the commit time) drops the random
      # serial number, so the same commit always gives a byte-identical SBOM.
      - name: SBOM
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/runtime-venv" uv sync --no-dev
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run --no-sync cyclonedx-py environment \
            --pyproject pyproject.toml --mc-type library --output-reproducible \
            --output-format JSON --output-file sbom.json "$RUNNER_TEMP/runtime-venv"

      # cyclonedx-py validates the format, not the contents: an SBOM of the wrong
      # environment is still valid CycloneDX. Check it describes this project.
      - name: SBOM describes mypackage and its runtime deps
        shell: python
        run: |
          import json
          bom = json.load(open("sbom.json"))
          names = {c["name"] for c in bom["components"]}
          subject = bom["metadata"].get("component", {}).get("name")
          assert subject == "mypackage", f"SBOM subject is {subject!r}, not 'mypackage' (--pyproject missing?)"
          assert "requests" in names, f"runtime dependency missing from SBOM: {sorted(names)}"
          assert not names & {"pytest", "pip-audit", "cyclonedx-bom"}, f"dev or tool packages in SBOM: {sorted(names)}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test, adversarial, types, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Check metadata
        run: uv run --only-group tools twine check --strict dist/*   # tools only, no project install
      - name: Wheel ships type information (py.typed)
        run: unzip -l dist/*.whl | grep -q 'mypackage/py.typed'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

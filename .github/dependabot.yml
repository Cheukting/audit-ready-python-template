# Dependabot keeps dependencies up to date. It does NOT audit for vulnerabilities;
# the `audit` CI job does that (pip-audit against PyPI and OSV), and fails the build on a known CVE.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Only pre-commit-hooks: ruff, ty and semgrep hooks run from uv.lock (uv ecosystem above).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
